apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: load-balancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: load-balancer/worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: lb-config
