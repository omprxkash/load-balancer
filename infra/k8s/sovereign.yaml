apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign
  namespace: load-balancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sovereign
  template:
    metadata:
      labels:
        app: sovereign
    spec:
      containers:
        - name: sovereign
          image: load-balancer/sovereign:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: lb-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign
  namespace: load-balancer
spec:
  selector:
    app: sovereign
  ports:
    - port: 8001
      targetPort: 8001
