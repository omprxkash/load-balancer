---
# jira-mock
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-mock
  namespace: load-balancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jira-mock
  template:
    metadata:
      labels:
        app: jira-mock
    spec:
      containers:
        - name: jira-mock
          image: load-balancer/jira-mock:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9010
---
apiVersion: v1
kind: Service
metadata:
  name: jira-mock
  namespace: load-balancer
spec:
  selector:
    app: jira-mock
  ports:
    - port: 9010
      targetPort: 9010
