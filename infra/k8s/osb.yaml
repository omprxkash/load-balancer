apiVersion: apps/v1
kind: Deployment
metadata:
  name: osb
  namespace: load-balancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: osb
  template:
    metadata:
      labels:
        app: osb
    spec:
      containers:
        - name: osb
          image: load-balancer/osb:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: lb-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: osb
  namespace: load-balancer
spec:
  selector:
    app: osb
  ports:
    - port: 8080
      targetPort: 8080
